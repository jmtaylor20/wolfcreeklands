<style>
:root{
--hunter:#203b2d;
--hunter2:#2f5a3f;
--charcoal:#101413;
--white:#ffffff;
--soft:#d7ded2;
--accent:#91aa6d;
--line:rgba(255,255,255,.14);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial,Helvetica,sans-serif;
background:
linear-gradient(90deg,rgba(16,20,19,.94),rgba(16,20,19,.74)),
url("assets/equipment/wolf-creek-hero-excavator.jpg");
background-size:cover;
background-position:center;
color:var(--white);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
line-height:1.6;
padding:30px;
}

.card{
width:min(760px,100%);
background:rgba(18,24,21,.94);
border:1px solid var(--line);
border-radius:30px;
padding:44px;
text-align:center;
box-shadow:0 22px 60px rgba(0,0,0,.34);
}

.logo{
max-width:320px;
margin:0 auto 26px;
filter:drop-shadow(0 4px 12px rgba(0,0,0,.55));
}

.kicker{
color:var(--accent);
font-size:14px;
font-weight:900;
letter-spacing:2px;
text-transform:uppercase;
margin-bottom:14px;
}

h1{
font-size:clamp(42px,6vw,72px);
line-height:.92;
text-transform:uppercase;
letter-spacing:-2px;
margin-bottom:18px;
}

p{
font-size:20px;
color:var(--soft);
max-width:620px;
margin:0 auto 26px;
}

.btn-wrap{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
margin-top:28px;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:14px 24px;
border-radius:999px;
font-weight:900;
text-decoration:none;
transition:.25s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-primary{
background:var(--hunter2);
color:white;
}

.btn-secondary{
background:white;
color:var(--charcoal);
}

.phone{
margin-top:24px;
font-weight:900;
color:white;
}

.phone small{
display:block;
font-size:13px;
color:var(--soft);
font-weight:700;
}

@media(max-width:700px){
.card{
padding:30px 22px;
}

.logo{
max-width:260px;
}
}

/* Mobile quick-contact bar */
.call-bar{
display:none;
position:fixed;
bottom:0;
left:0;
width:100%;
z-index:1200;
background:linear-gradient(90deg,rgba(32,59,45,.98),rgba(16,20,19,.98));
backdrop-filter:blur(12px);
border-top:1px solid var(--line);
box-shadow:0 -8px 30px rgba(0,0,0,.45);
grid-template-columns:1fr 1fr 1fr;
gap:8px;
padding:9px 10px;
padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
}

.call-bar a{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
padding:9px 4px;
border-radius:14px;
font-weight:900;
font-size:12.5px;
letter-spacing:.2px;
line-height:1.1;
border:1px solid var(--line);
background:rgba(255,255,255,.08);
color:#fff;
}

.call-bar a.cb-call{
background:var(--hunter2);
border-color:transparent;
}

.call-bar a.cb-estimate{
background:#fff;
color:var(--charcoal);
border-color:transparent;
}

.call-bar svg{
width:18px;
height:18px;
fill:none;
stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}

@media(max-width:760px){
.call-bar{display:grid;}
body{padding-bottom:78px;}
}
body.menu-open .call-bar{
display:none;
}
